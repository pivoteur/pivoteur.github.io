<html>
 <head>
  <title>Protocol Health</title>
  <link rel="stylesheet" href="protocol.css?version=12">
  <link rel='stylesheet' href='https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&display=swap'>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
  <script src="libs/colors.js"></script>
  <script>
    const covColor = d3.scaleLinear()
      .domain([0, 40, 60, 75, 90, 100])
      .range(['#ff6b6b', '#c45f10', '#f0c040', '#9be87a', '#5FD9A8', '#5FD9A8'])
      .clamp(true);
  </script>
 </head>
 <body>

  <div id="app-ticker"></div>
  <div id="app-nav"></div>

  <img class="bg-watermark" src="imgs/pivot-logo-sillo-nior.png" alt="">

  <main>
  <div class="health-row">
    <div class="health-box health-box-coverage">
      <div class="diag-section-heading" style="margin-top:0;">Code Coverage</div>
      <div id="coverage-bar-wrap" class="cov-grid"></div>
      <div id="graph-legend"></div>
      <div id="closed-issues"></div>
    </div>
    <div class="health-box health-box-tasks">
      <div class="diag-section-heading" style="margin-top:0;">Automated Tasks</div>
      <div id="task-list" class="task-list-grid"></div>
    </div>
  </div>
  </main>

  <script>
     function copyQuoteValue(el) {
       const val = el.dataset.copy;
       navigator.clipboard.writeText(val).then(() => {
         const priceEl = el.querySelector('.quote-price');
         const original = priceEl.textContent;
         el.classList.add('copied');
         priceEl.textContent = 'Copied!';
         setTimeout(() => {
           priceEl.textContent = original;
           el.classList.remove('copied');
         }, 900);
       }).catch(err => console.error('Copy failed:', err));
     }

     function timeAgo(isoStr) {
      const diff = Math.floor((Date.now() - new Date(isoStr)) / 1000);
      if (diff < 60)    return diff + 's ago';
      if (diff < 3600)  return Math.floor(diff / 60) + 'm ago';
      if (diff < 86400) return Math.floor(diff / 3600) + 'h ago';
      return Math.floor(diff / 86400) + 'd ago';
    }

    function fmtDate(isoStr) {
      const d = new Date(isoStr);
      return d.toLocaleString('en-US', { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit', hour12: true });
    }

    function renderClosedIssues(closedIssues, date) {
      const active = closedIssues.filter(r => r.closed_today > 0);
      let html = `<div class="legend-divider" style="margin:14px 0 10px"></div>
        <div class="legend-heading">Issues Closed Today
          <span class="quotes-date">${date}</span>
        </div>`;

      if (active.length === 0) {
        html += `<div class="quotes-unavailable">Pivot Tech internal is currently working diligently. No issues closed today.</div>`;
      } else {
        active.forEach(r => {
          const name = r.repo.split('/')[1];
          html += `<div class="legend-row">
            <div class="legend-left">
              <span class="legend-dot" style="background:var(--green);box-shadow:0 0 5px rgba(95,217,168,0.53)"></span>
              <span class="legend-label">${name}</span>
            </div>
            <span class="legend-value" style="color:var(--green)">${r.closed_today} closed</span>
          </div>`;
        });
      }

      document.getElementById('closed-issues').innerHTML = html;
    }

    function renderTaskRow(name, isPass, pillLabel, countHtml, ranAt) {
      if (isPass) {
        const timeHtml = ranAt && ranAt !== 'unknown' ? `<span class="task-time">${timeAgo(ranAt)}</span>` : '';
        return `<div class="task-compact">
          <div class="task-compact-left"><span class="dot dot-pass"></span><span class="task-name">${name}</span></div>
          ${countHtml}${timeHtml}
        </div>`;
      }
      const cls     = pillLabel === 'UNKNOWN' ? 'unknown' : 'fail';
      const timeHtml = ranAt && ranAt !== 'unknown'
        ? `<div class="task-time">${timeAgo(ranAt)}<br>${fmtDate(ranAt)}</div>`
        : `<div class="task-time">—</div>`;
      return `<div class="task-row task-row-${cls}">
        <div class="task-row-top">
          <span class="task-name">${name}</span>
          <div class="task-right">
            ${countHtml}
            <span class="task-pill task-pill-${cls}">${pillLabel}</span>
            ${timeHtml}
          </div>
        </div>
      </div>`;
    }

    // Crate labels in diagnostics.txt are unqualified for protocol (book, libs,
    // quizzes, dapps) and qualified with ":trading" for trading's colliding
    // labels (dapps:trading, quizzes:trading). Trading's own libs-equivalent
    // crate is named "trading" itself, so it needs no qualifier -- it maps to
    // the trading repo by name alone.
    const REPO_FULL          = { protocol: 'pivoteur/protocol', trading: 'pivoteur/trading' };
    const CRATE_DEFAULT_REPO = { trading: 'trading' };

    // Repos whose coverage card should still render, in a pending state, even
    // before their first RAT run has ever produced diagnostics.txt data --
    // covers the bootstrap window right after a new repo's automation is
    // merged but hasn't fired on its own schedule yet.
    const PENDING_COV_REPOS = ['pivoteur/trading'];

    Promise.all([
      fetch('data/diagnostics.txt').then(r => { if (!r.ok) throw new Error('Could not load diagnostics.txt'); return r.text(); }),
      fetch('data/workflows.json').then(r => { if (!r.ok) throw new Error('Could not load workflows.json'); return r.json(); })
    ])
    .then(([text, workflowsData]) => {
      const { workflows = [], closed_issues = [] } = workflowsData;
      renderClosedIssues(closed_issues, workflowsData.date || '');

      const lines = text.split('\n');
      let stamp = '';
      const entries = [];
      let cur = null;

      lines.forEach(line => {
        if (line.startsWith('=== RAT Diagnostics Log')) {
          const m = line.match(/\((.+?)\)/);
          if (m) stamp = m[1];
        } else if (line.startsWith('--- [')) {
          if (cur) entries.push(cur);
          const rest = line.replace(/^---\s*/, '');
          const bm   = rest.match(/^\[([\w:]+)\]\s*(.*)/);
          if (!bm) return;
          const rawCrate  = bm[1];
          const remainder = bm[2];
          const [crateBase, repoSlugRaw] = rawCrate.split(':');
          const repoSlug = repoSlugRaw || CRATE_DEFAULT_REPO[crateBase] || 'protocol';
          const repo     = REPO_FULL[repoSlug] || REPO_FULL.protocol;
          const parts     = remainder.split('|').map(s => s.trim());
          let sublabel = null, startIdx = 0;
          if (parts[0] && !parts[0].match(/All tests passed|TESTS FAILED/i) && parts.length > 1) {
            sublabel = parts[0]; startIdx = 1;
          }
          const verdict = parts[startIdx] || '';
          const status  = verdict.includes('TESTS FAILED') ? 'fail' : 'pass';
          let coverage = null, passed = null, failed = null, linesC, linesT;
          parts.forEach(p => {
            const cm = p.match(/([\d.]+)%\s*coverage/);
            const pm = p.match(/(\d+)\s*passed/);
            const fm = p.match(/(\d+)\s*failed/);
            const lm = p.match(/lines:\s*(\d+)\/(\d+)/);
            if (cm) coverage = parseFloat(cm[1]);
            if (pm) passed   = parseInt(pm[1]);
            if (fm) failed   = parseInt(fm[1]);
            if (lm) { linesC = parseInt(lm[1]); linesT = parseInt(lm[2]); }
          });
          cur = { crate: crateBase, repo, sublabel, status, coverage, passed, failed, failures: [], total: null, totalOf: null, linesC, linesT };
        } else if (line.match(/total:\s*\d+\/\d+/) && cur) {
          const m = line.match(/total:\s*(\d+)\/(\d+)/);
          if (m) { cur.total = parseInt(m[1]); cur.totalOf = parseInt(m[2]); }
        } else if (line.match(/^\s+\S+::\S+/) && cur) {
          cur.failures.push(line.trim());
        } else if (line.trim() === '' && cur) {
          entries.push(cur); cur = null;
        }
      });
      if (cur) entries.push(cur);

       // ----- Automated tasks (grouped by repo) -------------------------------------------------
       const taskGroups = new Map(); // repo -> { tasks: [], itr: null|entry }
       function taskGroup(repo) {
         if (!taskGroups.has(repo)) taskGroups.set(repo, { tasks: [], itr: null });
         return taskGroups.get(repo);
       }
       workflows.forEach(w => taskGroup(w.repo).tasks.push(w));
       entries
         .filter(e => e.crate === 'dapps' && e.total !== null)
         .forEach(e => { taskGroup(e.repo).itr = e; });

       let taskHtml = '';
       taskGroups.forEach((group, repo) => {
         let rows = '';
         group.tasks.forEach(w => {
           const isPass = w.status === 'success';
           const pill   = w.status === 'unknown' ? 'UNKNOWN' : (isPass ? 'SUCCESS' : 'FAILED');
           rows += renderTaskRow(w.name, isPass, pill, '', w.ran_at);
         });
         if (group.itr) {
           const dappsEntry = group.itr;
           const pct       = dappsEntry.totalOf ? (dappsEntry.total / dappsEntry.totalOf) * 100 : 100;
           const isPass    = pct === 100;
           const color     = covColor(pct);
           const countHtml = `<span class="task-count" style="color:${color}">${dappsEntry.total}/${dappsEntry.totalOf}</span>`;
           rows += isPass
             ? `<div class="task-compact">
                 <div class="task-compact-left"><span class="dot dot-pass"></span><span class="task-name">ITR</span></div>
                 ${countHtml}
               </div>`
             : `<div class="task-row task-row-fail">
                 <div class="task-row-top">
                   <span class="task-name">ITR</span>
                   <span class="task-pill task-pill-fail">FAILURE</span>
                   <div class="task-right">${countHtml}</div>
                 </div>
               </div>`;
         }
         taskHtml += `<div class="task-group">
           <div class="task-group-head">${repo.split('/')[1]}</div>
           <div class="task-group-body">${rows}</div>
         </div>`;
       });
       document.getElementById('task-list').innerHTML = taskHtml;

       // ---- Coverage (grouped by repo) --------------------------------
       const chartCrates = ['book', 'libs', 'trading', 'quizzes'];
       const covByRepo = new Map(); // repo -> { crate: {c,t,pctOnly} }

       entries.forEach(e => {
         if (!chartCrates.includes(e.crate)) return;
         if (!covByRepo.has(e.repo)) covByRepo.set(e.repo, {});
         const repoData = covByRepo.get(e.repo);
         if (e.linesC !== undefined) {
           // Accumulate rather than overwrite, in case a crate appears in
           // more than one diagnostics block (e.g. a split test run).
           if (!repoData[e.crate]) repoData[e.crate] = { c: 0, t: 0 };
           repoData[e.crate].c += e.linesC;
           repoData[e.crate].t += e.linesT;
         } else if (!repoData[e.crate] && e.coverage !== null) {
           repoData[e.crate] = { c: e.coverage, t: null, pctOnly: true };
         }
       });

       function renderCoverageGroup(repo, repoData) {
         const cratesPresent  = chartCrates.filter(c => repoData[c]);
         const realCrates     = cratesPresent.filter(c => !repoData[c].pctOnly);
         const totalCovered   = realCrates.reduce((s, c) => s + repoData[c].c, 0);
         const totalLines     = realCrates.reduce((s, c) => s + repoData[c].t, 0);
         const totalUncovered = totalLines - totalCovered;
         const nominalLines   = realCrates.length ? totalLines / realCrates.length : 0;
         if (!totalLines) return '';

         const overallPct   = (totalCovered / totalLines) * 100;
         const overallColor = covColor(overallPct);
         // Total the bar is being divided over: real lines plus one
         // nominal-size slot per pctOnly crate, so shares still sum to 100%.
         const barTotal = totalLines + (cratesPresent.length - realCrates.length) * nominalLines;

         const segs = cratesPresent.map(c => {
           const d = repoData[c];
           const cratePct = d.pctOnly ? d.c : (d.c / d.t) * 100;
           const share = d.pctOnly
             ? (barTotal ? (nominalLines / barTotal) * 100 : 0)
             : (barTotal ? (d.c / barTotal) * 100 : 0);
           return { crate: c, share, cratePct, color: covColor(cratePct) };
         });
         const uncoveredShare = barTotal ? (totalUncovered / barTotal) * 100 : 0;

         let segHtml = segs.map(s =>
          `<div class="seg seg-labeled" style="width:${s.share.toFixed(2)}%;background:${s.color};" title="${s.crate}: ${s.share.toFixed(1)}%/${overallPct.toFixed(1)}%">
            <span class="seg-label" data-short="${s.cratePct.toFixed(0)}%" style="color:${textOnFill(s.color)};">${s.crate} ${s.cratePct.toFixed(0)}%</span>
          </div>`
        ).join('');
        segHtml += `<div class="seg seg-uncovered" style="width:${uncoveredShare.toFixed(2)}%" title="uncovered: ${uncoveredShare.toFixed(1)}%/${overallPct.toFixed(1)}%"></div>`;

        const legendHtml = cratesPresent.map(c => {
          const d = repoData[c];
          const cratePct = d.pctOnly ? d.c : (d.c / d.t) * 100;
          const lc       = covColor(cratePct);
          const valStr   = d.pctOnly ? d.c.toFixed(2) + '%' : `${d.c.toLocaleString()} / ${d.t.toLocaleString()}`;
          return `<div class="legend-row">
            <div class="legend-left">
              <span class="legend-dot" style="background:${lc};box-shadow:0 0 5px ${lc}88"></span>
              <span class="legend-label">[${c}]</span>
            </div>
            <span class="legend-value" style="color:${lc}">${valStr}</span>
          </div>`;
        }).join('');

        return `<div class="cov-group">
          <div class="cov-group-head">${repo.split('/')[1]}</div>
          <div class="num coverage-pct" style="color:${overallColor};">${overallPct.toFixed(1)}%</div>
          <div class="segbar">${segHtml}</div>
          <div class="cov-legend">${legendHtml}</div>
        </div>`;
       }

       function renderPendingCoverageGroup(repo) {
         return `<div class="cov-group">
           <div class="cov-group-head">${repo.split('/')[1]}</div>
           <div class="num coverage-pct cov-pct-pending">—%</div>
           <div class="segbar cov-segbar-pending"></div>
           <div class="cov-legend">
             <div class="legend-row">
               <div class="legend-left">
                 <span class="legend-label cov-pending-label">Awaiting first RAT run</span>
               </div>
             </div>
           </div>
         </div>`;
       }

       const covBarWrap = document.getElementById('coverage-bar-wrap');
       let covHtml = '';
       covByRepo.forEach((repoData, repo) => { covHtml += renderCoverageGroup(repo, repoData); });
       PENDING_COV_REPOS
         .filter(repo => !covByRepo.has(repo))
         .forEach(repo => { covHtml += renderPendingCoverageGroup(repo); });
       covBarWrap.innerHTML = covHtml;
       fitSegLabels(covBarWrap);

       // ---- Quotes of the Day ------------------------------------------------------------------
       const SHOW_TOKENS = ['BTC', 'ETH', 'AVAX', 'USDC', 'UNDEAD'];

       fetch('libs/quotes.json')
         .then(r => { if (!r.ok) throw new Error('quotes.json not found'); return r.json(); })
         .then(qdata => {
           const quotes = qdata.quotes || {};
           const date   = qdata.date   || '';
           let qHtml = `
             <div class="legend-divider" style="margin:14px 0 10px"></div>
             <div class="legend-heading">Quotes of the Day
               <span class="quotes-date">${date}</span>
             </div>`;
           SHOW_TOKENS
             .filter(token => token in quotes)
             .forEach(token => {
               const price = quotes[token];
               const fmt = price < 0.01
                 ? price.toFixed(8)
                 : price < 1
                 ? price.toFixed(6)
                 : price >= 1000
                 ? price.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })
                 : price.toFixed(2);
               const copyVal = fmt.replace(/,/g, '');
               qHtml += `<div class="quote-row copyable" data-copy="${copyVal}" onclick="copyQuoteValue(this)" title="Click to copy value">
                 <span class="quote-token">${token}</span>
                 <span class="quote-price">$${fmt}</span>
               </div>`;
             });
           document.getElementById('graph-legend').insertAdjacentHTML('beforeend', qHtml);
         })
         .catch(() => {
           document.getElementById('graph-legend').insertAdjacentHTML('beforeend',
             `<div class="legend-divider" style="margin:14px 0 10px"></div>
              <div class="quotes-unavailable">Quotes unavailable</div>`);
         });

     })
     .catch(err => {
       document.getElementById('graph-legend').innerHTML =
         `<div class="diag-fail-banner">Could not load data: ${err.message}</div>`;
     });
  </script>
  <script src="libs/pool-assets.js"></script>
  <script src='libs/chrome.js'></script>
 </body>
</html>
